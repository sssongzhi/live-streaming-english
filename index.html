。"}, {"label": false, "text": "第二天早上，Lily 告诉 Emma，她担心再次开播。"}, {"label": false, "text": "她说：“我知道自己不可能让所有人满意，但当有人在其他人面前批评我时，很难保持自信。”"}, {"label": false, "text": "Emma 听她说，没有打断。她没有让 Lily 忽略自己的感受，而是承认这次经历令人难过。"}, {"label": false, "text": "她解释道：“你不必仅仅因为自己是主播，就接受不尊重人的行为。我们一起看看有哪些可用的管理工具，并商量好如何应对类似情况。”"}, {"label": false, "text": "她们一起准备了一段简短的回应话术，供 Lily 在类似情况再次发生时使用。她们还讨论了什么时候应该停止回应，转而使用平台的举报或屏蔽功能。"}, {"label": false, "text": "Emma 建议下一场直播围绕一个 Lily 熟悉的话题展开，让她在引导对话时感到更自在。"}, {"label": false, "text": "直播结束后，她们会复盘 Lily 当时的感受，以及这套方案是否有效。目标是帮助她自信地回应，同时维护自己的边界。"}], "topic_en": "What would you say to a host the morning after a rude comment — in the first two minutes?", "topic_zh": "主播被恶评的第二天早上，你见到她的前两分钟会说什么？", "roles": ["不想再开播的主播 Lily", "平台运营 Emma", "出言不逊的观众"], "prompt": "你扮演主播 Lily，昨晚被观众评论外貌，今天不想开播。我是平台运营。请用英文说出你的担心，并对“直接举报就好”这种建议表达不满。"}]};</script>
<script>
(function(){
  "use strict";
  const DATA = window.__DATA__;
  const SCENES = DATA.scenes;
  const STEPS = DATA.steps;
  const STEP_IDS = STEPS.map(s => s.id);
  const KEY = "elelive.english.practice.v1";
  const home = document.getElementById("home");
  const practice = document.getElementById("practice");
  const homeStart = document.getElementById("homeStart");
  const stage = document.getElementById("stage");
  const nav = document.getElementById("sceneNav");
  const drawer = document.getElementById("drawer");
  const drawerBody = document.getElementById("drawerBody");
  const drawerNum = document.getElementById("drawerNum");
  const scrim = document.getElementById("scrim");
  const toastEl = document.getElementById("toast");
  const meterFill = document.getElementById("meterFill");
  const meterText = document.getElementById("meterText");
  const meterTrack = document.getElementById("meterTrack");

  const SPEAKER = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6h2.2L9 3.2v9.6L5.2 10H3z" fill="currentColor"/><path d="M11.2 5.4c.9.6 1.4 1.5 1.4 2.6s-.5 2-1.4 2.6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>';

  let state = loadState();
  let lastFocus = null;
  let saveTimer = null;
  let savedTimer = null;

  function loadState(){
    const base = { scene: 1, step: "read", zh: false, blur: false, done: {}, drafts: {} };
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return base;
      const saved = JSON.parse(raw);
      const hasSavedScene = SCENES.some(scene => scene.id === saved.scene);
      return Object.assign(base, saved, {
        scene: hasSavedScene ? saved.scene : base.scene,
        step: hasSavedScene ? saved.step : base.step,
        done: saved.done || {},
        drafts: saved.drafts || {}
      });
    } catch (err) {
      return base;
    }
  }

  function persist(now){
    clearTimeout(saveTimer);
    const write = () => {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (err) {}
    };
    if (now) write();
    else saveTimer = setTimeout(write, 220);
  }

  function esc(value){
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  const hasCN = text => /[\u4e00-\u9fff]/.test(text);
  const sceneById = id => SCENES.find(s => s.id === id);
  const stepById = id => STEPS.find(s => s.id === id);
  const doneKey = (scene, step) => scene + "." + step;
  const isDone = (scene, step) => !!state.done[doneKey(scene, step)];
  const pad = n => String(n).padStart(2, "0");
  const paraText = p => p.segs.map(seg => seg.t).join("");

  function countWords(text){
    const trimmed = String(text || "").trim();
    if (!trimmed) return 0;
    return trimmed.split(/\s+/).length;
  }

  /* ---------- navigation ---------- */
  function renderRoute(){
    const match = location.hash.match(/^#s(\d+)\/([a-z]+)$/);
    const scene = match && sceneById(Number(match[1]));
    const showPractice = Boolean(scene && STEP_IDS.includes(match[2]));
    home.hidden = showPractice;
    practice.hidden = !showPractice;
    if (showPractice) {
      state.scene = scene.id;
      state.step = match[2];
      persist(true);
      render();
    } else {
      document.title = DATA.meta.title;
      homeStart.href = "#s" + state.scene + "/" + state.step;
      homeStart.firstElementChild.textContent = state.scene === 1 && state.step === "read"
        && !SCENES.some(item => STEP_IDS.some(step => isDone(item.id, step))) ? "开始练习" : "继续练习";
      updateMeter();
    }
  }

  function go(scene, step, opts){
    const target = sceneById(scene);
    if (!target) return;
    if (!STEP_IDS.includes(step)) step = "read";
    state.scene = scene;
    state.step = step;
    persist();
    try { history.replaceState(null, "", "#s" + scene + "/" + step); } catch (err) {}
    render();
    if (!(opts && opts.keepScroll)) window.scrollTo({ top: 0, behavior: "auto" });
  }

  function render(){
    const scene = sceneById(state.scene);
    document.title = pad(scene.id) + " " + scene.title + " · 海外社交直播英语";
    stage.innerHTML = sceneHead(scene) + tabs() + '<section class="panel" id="panel">' + panel(scene) + "</section>";
    renderNav();
    updateMeter();
  }

  function sceneHead(scene){
    const bodyText = scene.paragraphs.map(paraText).join(" ");
    const words = countWords(bodyText);
    const minutes = Math.max(1, Math.round(words / 170));
    return '' +
      '<header class="scene-head">' +
        '<p class="eyebrow">Scene ' + pad(scene.id) + " · " + (scene.writing ? "Writing" : "Reading") + '</p>' +
        '<h1 tabindex="-1">' + esc(scene.title) + '</h1>' +
        '<p class="scene-meta">' + scene.paragraphs.length + " 段 · " + scene.sentences.length + " 句 · 约 " + minutes + " 分钟 · " + words + ' words</p>' +
        '<ul class="objectives">' + scene.objectives.map(item => "<li>" + esc(item) + "</li>").join("") + '</ul>' +
      '</header>';
  }

  function writingBrief(writing){
    return '' +
      '<aside class="brief">' +
        '<p class="eyebrow">Writing task · 写作题</p>' +
        '<h2>' + esc(writing.title) + '</h2>' +
        '<p>' + esc(writing.intro) + '</p>' +
        (writing.quote ? '<blockquote>' + esc(writing.quote) + '</blockquote>' : "") +
        '<p class="task">' + esc(writing.task) + '</p>' +
      '</aside>';
  }

  function tabs(){
    return '<nav class="tabs" aria-label="练习步骤">' + STEPS.map(step => {
      const active = state.step === step.id;
      return '<button class="tab' + (active ? " is-active" : "") + '" data-act="step" data-step="' + step.id + '" title="' + esc(step.hint) + '"' + (active ? ' aria-current="step"' : "") + '>' +
        '<span class="tab-label">' + esc(step.label) + '</span>' +
        (isDone(state.scene, step.id) ? '<span class="tab-done" aria-label="已完成"></span>' : "") +
      '</button>';
    }).join("") + '</nav>';
  }

  function panel(scene){
    switch (state.step) {
      case "read": return readPanel(scene);
      case "syntax": return syntaxPanel(scene);
      case "vocab": return vocabPanel(scene);
      case "translate": return translatePanel(scene);
      case "output": return outputPanel(scene);
      default: return readPanel(scene);
    }
  }

  function doneBtn(sceneId, step){
    const done = isDone(sceneId, step);
    const last = sceneId === SCENES[SCENES.length - 1].id;
    return '<footer class="panel-foot">' +
      '<button class="done-btn' + (done ? " is-done" : "") + '" data-act="mark" aria-pressed="' + done + '">' + (done ? "已完成" : "标记本步完成") + '</button>' +
      '<span class="foot-hint">' + esc(stepById(step).hint) + '</span>' +
      '<button class="next-scene" data-act="next">' + (last ? "回到第 1 场景" : "下一场景") + ' <span aria-hidden="true">→</span></button>' +
    '</footer>';
  }

  /* ---------- reading ---------- */
  function readPanel(scene){
    const blocks = scene.paragraphs.map(p => {
      const segments = p.segs.map(seg => {
        if (!seg.n) return esc(seg.t);
        return '<span class="sent" role="button" tabindex="0" data-act="sent" data-n="' + seg.n + '" aria-label="查看第 ' + seg.n + ' 句的拆分">' + esc(seg.t) + '</span>';
      }).join("");
      return '<div class="para-block">' +
        '<p class="para">' + segments + '</p>' +
        (p.zh ? '<p class="para-zh">' + esc(p.zh) + '</p>' : "") +
      '</div>';
    }).join("");
    return '' +
      (scene.writing ? writingBrief(scene.writing) : "") +
      '<div class="panel-head">' +
        '<div>' +
          '<p class="eyebrow">Text · 正文</p>' +
          '<h2 class="body-title">' + esc(scene.bodyTitle) + '</h2>' +
        '</div>' +
        '<div class="tools"><button class="switch" data-act="toggle-zh" aria-pressed="' + state.zh + '">中文对照</button></div>' +
      '</div>' +
      '<p class="lede">点击任意句子，查看它的成分与搭配；中文对照默认隐藏，读完一段再打开更有效。</p>' +
      '<div class="prose' + (state.zh ? " show-zh" : "") + '">' + blocks + '</div>' +
      doneBtn(scene.id, "read");
  }

  /* ---------- syntax ---------- */
  function syntaxPanel(scene){
    const cards = scene.sentences.map(s => '' +
      '<details class="syn-card" data-n="' + s.n + '">' +
        '<summary>' +
          '<span class="syn-num">' + pad(s.n) + '</span>' +
          '<span class="syn-line">' + s.chunks.map(chunk => '<span class="chunk">' + esc(chunk) + '</span>').join("") + '</span>' +
          '<span class="chev" aria-hidden="true"></span>' +
        '</summary>' +
        '<div class="syn-inner">' +
          '<dl class="syn-dl">' +
            '<dt>句子成分与结构</dt><dd>' + esc(s.structure) + '</dd>' +
            '<dt>固定搭配与语法</dt><dd>' + esc(s.grammar) + '</dd>' +
          '</dl>' +
          '<button class="btn-line" data-act="speak-sentence" data-n="' + s.n + '">朗读原句</button>' +
        '</div>' +
      '</details>').join("");
    return '' +
      '<div class="panel-head">' +
        '<div>' +
          '<p class="eyebrow">Syntax · 长难句</p>' +
          '<h2 class="body-title">句子拆分</h2>' +
        '</div>' +
        '<div class="tools"><button class="btn-line" data-act="expand-all" aria-expanded="false">全部展开</button></div>' +
      '</div>' +
      '<p class="lede">先自己划出意群，再展开对照。斜线只是意群边界，不是语法单位。</p>' +
      '<div class="syn-list">' + cards + '</div>' +
      doneBtn(scene.id, "syntax");
  }

  /* ---------- vocabulary ---------- */
  function vocabPanel(scene){
    return '' +
      '<div class="panel-head">' +
        '<div>' +
          '<p class="eyebrow">Words · 表达</p>' +
          '<h2 class="body-title">表达与词汇</h2>' +
        '</div>' +
        '<div class="tools"><button class="switch" data-act="toggle-blur" aria-pressed="' + state.blur + '">遮住中文自测</button></div>' +
      '</div>' +
      '<p class="lede">点单词旁的喇叭听发音。打开“遮住中文”后，释义会变模糊，鼠标移上去才显示，可以当作快速自测。</p>' +
      '<div class="vocab-wrap' + (state.blur ? " is-blurred" : "") + '">' +
        (scene.expressions ? tableBlock("常用表达", scene.expressions) : "") +
        (scene.vocab ? tableBlock("重点词汇", scene.vocab) : "") +
      '</div>' +
      doneBtn(scene.id, "vocab");
  }

  function tableBlock(title, table){
    const head = table.head.map(cell => "<th>" + esc(cell) + "</th>").join("");
    const rows = table.rows.map(row => "<tr>" + row.map((cell, index) => {
      const zhClass = hasCN(cell) ? ' class="zh"' : "";
      if (index === 0 && !hasCN(cell)) {
        const spoken = cell.split(" / ")[0];
        return "<td" + zhClass + '><button class="word" data-act="speak" data-speak="' + esc(spoken) + '">' + esc(cell) + SPEAKER + "</button></td>";
      }
      return "<td" + zhClass + ">" + esc(cell) + "</td>";
    }).join("") + "</tr>").join("");
    return '<section class="vocab-block">' +
      "<h3>" + esc(title) + "<span>" + table.rows.length + "</span></h3>" +
      '<div class="table-scroll"><table class="vtable"><thead><tr>' + head + "</tr></thead><tbody>" + rows + "</tbody></table></div>" +
    "</section>";
  }

  /* ---------- translation ---------- */
  function translatePanel(scene){
    const source = scene.zhBlocks.map(block => block.label
      ? '<h3 class="zh-label">' + esc(block.text) + "</h3>"
      : "<p>" + esc(block.text) + "</p>"
    ).join("");
    const draft = state.drafts["s" + scene.id + ".translate"] || "";
    const original = scene.paragraphs.map((p, index) =>
      '<p><span class="orig-i">' + pad(index + 1) + "</span>" + esc(paraText(p)) + "</p>"
    ).join("");
    return '' +
      '<div class="panel-head">' +
        '<div>' +
          '<p class="eyebrow">Rewrite · 回译</p>' +
          '<h2 class="body-title">看中文，写回英文</h2>' +
        '</div>' +
      '</div>' +
      '<p class="lede">先不看原文，把下面的中文用英文写回来。自然、准确即可，不必逐字复原；写完再对照原文。</p>' +
      '<div class="zh-source">' + source + '</div>' +
      '<div class="writing">' +
        '<textarea class="area" data-draft="s' + scene.id + '.translate" placeholder="Write your English version here…" spellcheck="true">' + esc(draft) + '</textarea>' +
        '<div class="writing-foot">' +
          '<span class="count" data-count>' + countWords(draft) + ' words</span>' +
          '<span class="save-dot">自动保存</span>' +
          '<button class="btn-line" data-act="reveal">对照英文原文</button>' +
        '</div>' +
      '</div>' +
      '<div class="original" id="original" hidden>' +
        '<p class="eyebrow">Original · 英文原文</p>' + original +
      '</div>' +
      doneBtn(scene.id, "translate");
  }

  /* ---------- output ---------- */
  function outputPanel(scene){
    const draft = state.drafts["s" + scene.id + ".output"] || "";
    return '' +
      '<div class="panel-head">' +
        '<div>' +
          '<p class="eyebrow">Free style · 输出</p>' +
          '<h2 class="body-title">自己说一遍</h2>' +
        '</div>' +
        '<div class="tools"><button class="btn-line" data-act="copy-topic">复制主题</button></div>' +
      '</div>' +
      '<div class="topic">' +
        '<p class="topic-en">' + esc(scene.topic_en) + '</p>' +
        '<p class="topic-zh">' + esc(scene.topic_zh) + '</p>' +
      '</div>' +
      '<p class="lede">先脱离原文，用英文口述 60 秒，再写下来。比起复述课文，更重要的是给出你自己的判断和办法。</p>' +
      '<div class="writing">' +
        '<textarea class="area" data-draft="s' + scene.id + '.output" placeholder="Write or paste your answer here…" spellcheck="true">' + esc(draft) + '</textarea>' +
        '<div class="writing-foot">' +
          '<span class="count" data-count>' + countWords(draft) + ' words</span>' +
          '<span class="save-dot">自动保存</span>' +
        '</div>' +
      '</div>' +
      '<div class="roleplay">' +
        '<p class="eyebrow">Role play · 角色对练</p>' +
        '<div class="roles">' + scene.roles.map(role => '<span class="role">' + esc(role) + '</span>').join("") + '</div>' +
        '<p class="lede">把下面这段发给 AI，让它扮演对手方，一次只问一个问题，并纠正你的表达。</p>' +
        '<div class="prompt-box">' +
          '<p>' + esc(scene.prompt) + '</p>' +
          '<button class="btn-line" data-act="copy-prompt">复制提示词</button>' +
        '</div>' +
      '</div>' +
      doneBtn(scene.id, "output");
  }

  /* ---------- sidebar ---------- */
  function renderNav(){
    nav.innerHTML = SCENES.map(scene => {
      const active = scene.id === state.scene;
      const dots = STEP_IDS.map(id => {
        const on = isDone(scene.id, id);
        const here = active && state.step === id;
        return '<button class="dot' + (on ? " is-on" : "") + (here ? " is-here" : "") + '" data-act="scene" data-scene="' + scene.id + '" data-step="' + id + '" tabindex="-1" title="' + esc(stepById(id).label) + (on ? " · 已完成" : "") + '"></button>';
      }).join("");
      return '<div class="scene-row' + (active ? " is-active" : "") + '">' +
        '<button class="scene-link" data-act="scene" data-scene="' + scene.id + '">' +
          '<span class="scene-num">' + pad(scene.id) + '</span>' +
          '<span class="scene-title">' + esc(scene.title) + '</span>' +
        '</button>' +
        '<div class="dots" role="group" aria-label="步骤进度">' + dots + '</div>' +
      '</div>';
    }).join("");
  }

  function updateMeter(){
    const total = SCENES.length * STEP_IDS.length;
    let done = 0;
    SCENES.forEach(scene => STEP_IDS.forEach(id => { if (isDone(scene.id, id)) done += 1; }));
    meterFill.style.width = (done / total * 100) + "%";
    meterText.textContent = done + " / " + total;
    meterTrack.setAttribute("aria-valuenow", String(done));
    meterTrack.setAttribute("aria-valuemax", String(total));
  }

  /* ---------- progress & drafts ---------- */
  function toggleMark(){
    const key = doneKey(state.scene, state.step);
    if (state.done[key]) delete state.done[key];
    else state.done[key] = true;
    persist(true);
    const done = !!state.done[key];
    stage.querySelectorAll(".done-btn").forEach(btn => {
      btn.classList.toggle("is-done", done);
      btn.setAttribute("aria-pressed", String(done));
      btn.textContent = done ? "已完成" : "标记本步完成";
    });
    const tab = stage.querySelector('.tab[data-step="' + state.step + '"]');
    if (tab) {
      const mark = tab.querySelector(".tab-done");
      if (done && !mark) {
        const dot = document.createElement("span");
        dot.className = "tab-done";
        dot.setAttribute("aria-label", "已完成");
        tab.appendChild(dot);
      } else if (!done && mark) {
        mark.remove();
      }
    }
    renderNav();
    updateMeter();
    toast(done ? "已标记完成" : "已取消完成");
  }

  function refreshCount(input){
    const foot = input.closest(".writing");
    if (!foot) return;
    const count = foot.querySelector("[data-count]");
    if (count) count.textContent = countWords(input.value) + " words";
    const saved = foot.querySelector(".save-dot");
    if (saved) {
      saved.textContent = "已保存";
      clearTimeout(savedTimer);
      savedTimer = setTimeout(() => {
        document.querySelectorAll(".save-dot").forEach(el => { el.textContent = "自动保存"; });
      }, 1400);
    }
  }

  /* ---------- sentence drawer ---------- */
  function openSentence(number){
    const scene = sceneById(state.scene);
    const sentence = scene.sentences.find(item => item.n === number);
    if (!sentence) return;
    drawerNum.textContent = pad(number);
    drawerBody.innerHTML = '' +
      '<p class="d-chunks">' + sentence.chunks.map(chunk => '<span>' + esc(chunk) + '</span>').join('<span class="d-slash">/</span>') + '</p>' +
      '<button class="btn-line" data-act="speak-sentence" data-n="' + number + '">朗读原句</button>' +
      '<dl class="d-analysis">' +
        '<dt>句子成分与结构</dt><dd>' + esc(sentence.structure) + '</dd>' +
        '<dt>固定搭配与语法</dt><dd>' + esc(sentence.grammar) + '</dd>' +
      '</dl>';
    lastFocus = document.activeElement;
    drawer.classList.add("is-open");
    drawer.setAttribute("aria-hidden", "false");
    scrim.classList.add("is-open");
    document.body.classList.add("no-scroll");
    drawer.querySelector("[data-act='close-drawer']").focus();
  }

  function closeDrawer(){
    drawer.classList.remove("is-open");
    drawer.setAttribute("aria-hidden", "true");
    scrim.classList.remove("is-open");
    document.body.classList.remove("no-scroll");
    if (lastFocus && typeof lastFocus.focus === "function") lastFocus.focus();
  }

  /* ---------- speech ---------- */
  function speak(text){
    if (!("speechSynthesis" in window)) {
      toast("当前浏览器不支持朗读");
      return;
    }
    const clean = String(text || "").replace(/\s*\/\s*/g, ", ").trim();
    if (!clean) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(clean);
    utterance.lang = "en-US";
    utterance.rate = 0.94;
    const voices = window.speechSynthesis.getVoices();
    const voice = voices.find(v => v.lang === "en-US" && /Samantha|Aria|Jenny|Google US|Microsoft (Aria|Jenny|Guy)/i.test(v.name))
      || voices.find(v => v.lang === "en-US")
      || voices.find(v => (v.lang || "").indexOf("en") === 0);
    if (voice) utterance.voice = voice;
    window.speechSynthesis.speak(utterance);
  }

  function speakSentence(number){
    const scene = sceneById(state.scene);
    const sentence = scene.sentences.find(item => item.n === number);
    if (sentence) speak(sentence.text);
  }

  /* ---------- clipboard & toast ---------- */
  function toast(message){
    toastEl.textContent = message;
    toastEl.classList.add("is-show");
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toastEl.classList.remove("is-show"), 1700);
  }

  function copy(text){
    const done = () => toast("已复制");
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done){
    const area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    try { document.execCommand("copy"); done(); } catch (err) { toast("复制失败，请手动选择"); }
    area.remove();
  }

  function buildPrompt(){
    const scene = sceneById(state.scene);
    return "【场景 " + scene.id + " · " + scene.title + "】\n" +
      scene.objectives.map(item => "· " + item).join("\n") + "\n\n" +
      scene.prompt + "\n\n" +
      "请全部用英文与我对话，每次只问一个问题；如果我的表达不自然，先回应内容，再给出更地道的说法。";
  }

  /* ---------- events ---------- */
  document.addEventListener("click", event => {
    const el = event.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    if (act === "scene") {
      go(Number(el.dataset.scene), el.dataset.step || "read");
    } else if (act === "step") {
      go(state.scene, el.dataset.step);
    } else if (act === "sent") {
      openSentence(Number(el.dataset.n));
    } else if (act === "close-drawer") {
      closeDrawer();
    } else if (act === "toggle-zh") {
      state.zh = !state.zh;
      persist();
      el.setAttribute("aria-pressed", String(state.zh));
      const prose = stage.querySelector(".prose");
      if (prose) prose.classList.toggle("show-zh", state.zh);
    } else if (act === "toggle-blur") {
      state.blur = !state.blur;
      persist();
      el.setAttribute("aria-pressed", String(state.blur));
      const wrap = stage.querySelector(".vocab-wrap");
      if (wrap) wrap.classList.toggle("is-blurred", state.blur);
    } else if (act === "expand-all") {
      const cards = Array.from(stage.querySelectorAll(".syn-card"));
      const allOpen = cards.length > 0 && cards.every(card => card.open);
      cards.forEach(card => { card.open = !allOpen; });
      el.textContent = allOpen ? "全部展开" : "全部收起";
      el.setAttribute("aria-expanded", String(!allOpen));
    } else if (act === "speak") {
      speak(el.dataset.speak);
    } else if (act === "speak-sentence") {
      speakSentence(Number(el.dataset.n));
    } else if (act === "reveal") {
      const original = document.getElementById("original");
      if (!original) return;
      original.hidden = !original.hidden;
      el.textContent = original.hidden ? "对照英文原文" : "收起原文";
      if (!original.hidden) original.scrollIntoView({ behavior: "smooth", block: "nearest" });
    } else if (act === "mark") {
      toggleMark();
    } else if (act === "next") {
      const index = SCENES.findIndex(scene => scene.id === state.scene);
      const next = SCENES[(index + 1) % SCENES.length];
      go(next.id, "read");
    } else if (act === "copy-prompt") {
      copy(buildPrompt());
    } else if (act === "copy-topic") {
      const scene = sceneById(state.scene);
      copy(scene.topic_en + "\n" + scene.topic_zh);
    } else if (act === "reset") {
      if (window.confirm("确定清空全部练习进度和草稿吗？此操作无法撤销。")) {
        state.done = {};
        state.drafts = {};
        persist(true);
        render();
        toast("已重置");
      }
    }
  });

  stage.addEventListener("keydown", event => {
    if ((event.key === "Enter" || event.key === " ") && event.target.classList.contains("sent")) {
      event.preventDefault();
      event.target.click();
    }
  });

  stage.addEventListener("input", event => {
    const area = event.target.closest("textarea[data-draft]");
    if (!area) return;
    state.drafts[area.dataset.draft] = area.value;
    persist();
    refreshCount(area);
  });

  scrim.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && drawer.classList.contains("is-open")) closeDrawer();
  });

  window.addEventListener("hashchange", () => {
    if (!practice.hidden) persist(true);
    renderRoute();
    window.scrollTo(0, 0);
    (practice.hidden ? home : stage).querySelector("h1").focus({ preventScroll: true });
  });

  /* ---------- boot ---------- */
  document.getElementById("methodList").innerHTML = DATA.method.map(item =>
    "<li><b>" + esc(item.name) + "</b>" + esc(item.desc) + "</li>"
  ).join("");
  document.getElementById("homeScenes").innerHTML = SCENES.map(scene =>
    '<li><a href="#s' + scene.id + '/read"><span class="home-scene-number" aria-hidden="true">' +
    pad(scene.id) + '</span><span>' + esc(scene.title) + '</span><span class="home-arrow" aria-hidden="true">→</span></a></li>'
  ).join("");
  renderRoute();
})();
</script>
</body>
</html>
